name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      claude:
        description: "Also replay the back office with Claude as the judge (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pfa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PFA_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/pfa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm,mcp]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  evaluate:
    name: evaluations and the gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PFA_DATABASE_URL: postgresql://postgres@localhost:5432/pfa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm]"
      - name: Back office (replay, fault injection, shadow, crash, race, frozen worker)
        run: pfa backoffice --quick
      - name: Board inspection (unseen boards and DeepPCB)
        run: pfa inspect
      - name: Part programming (9,800 KiCad parts)
        run: pfa parts
      - name: Factory replanning
        run: pfa schedule --quick
      - name: Gate (may an agent keep running alone?)
        run: pfa gate
      - name: Claude replay
        if: ${{ inputs.claude }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pfa claude
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
          retention-days: 30
