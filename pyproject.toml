[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-factory-agents"
version = "1.0.0"
description = "AI agents for an electronics factory: board inspection, part programming and back office, evaluated before they run alone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "ortools>=9.10",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
mcp = ["mcp>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pfa = "pfa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pfa = ["sql/*.sql", "skills/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
